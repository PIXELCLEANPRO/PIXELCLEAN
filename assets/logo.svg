<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="cleanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="playClip">
      <path d="M188 148 L188 364 L356 256 Z"/>
    </clipPath>
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="114" ry="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Pixel mosaic filling the play-triangle silhouette -->
  <g clip-path="url(#playClip)">
    <!-- base clean gradient layer -->
    <rect x="150" y="120" width="230" height="280" fill="url(#cleanGrad)"/>

    <!-- corrupted / burned pixels overlaid on the left side, fading out to the right -->
    <g>
      <rect x="150" y="150" width="18" height="18" fill="#F97316"/>
      <rect x="150" y="186" width="18" height="18" fill="#EF4444" opacity="0.9"/>
      <rect x="150" y="222" width="18" height="18" fill="#FACC15" opacity="0.85"/>
      <rect x="150" y="258" width="18" height="18" fill="#EC4899" opacity="0.8"/>
      <rect x="150" y="294" width="18" height="18" fill="#F97316" opacity="0.7"/>
      <rect x="150" y="330" width="18" height="18" fill="#EF4444" opacity="0.6"/>

      <rect x="186" y="168" width="18" height="18" fill="#EF4444" opacity="0.75"/>
      <rect x="186" y="204" width="18" height="18" fill="#FACC15" opacity="0.7"/>
      <rect x="186" y="240" width="18" height="18" fill="#F97316" opacity="0.6"/>
      <rect x="186" y="276" width="18" height="18" fill="#EC4899" opacity="0.55"/>
      <rect x="186" y="312" width="18" height="18" fill="#FACC15" opacity="0.4"/>

      <rect x="222" y="186" width="18" height="18" fill="#F97316" opacity="0.4"/>
      <rect x="222" y="222" width="18" height="18" fill="#EF4444" opacity="0.35"/>
      <rect x="222" y="258" width="18" height="18" fill="#FACC15" opacity="0.3"/>
      <rect x="222" y="294" width="18" height="18" fill="#EC4899" opacity="0.2"/>

      <rect x="258" y="222" width="18" height="18" fill="#F97316" opacity="0.15"/>
      <rect x="258" y="258" width="18" height="18" fill="#EF4444" opacity="0.12"/>
    </g>

    <!-- thin grid lines to emphasize the pixel structure -->
    <g stroke="#0F172A" stroke-opacity="0.08" stroke-width="1">
      <line x1="186" y1="120" x2="186" y2="400"/>
      <line x1="222" y1="120" x2="222" y2="400"/>
      <line x1="258" y1="120" x2="258" y2="400"/>
      <line x1="294" y1="120" x2="294" y2="400"/>
      <line x1="150" y1="150" x2="380" y2="150"/>
      <line x1="150" y1="186" x2="380" y2="186"/>
      <line x1="150" y1="222" x2="380" y2="222"/>
      <line x1="150" y1="258" x2="380" y2="258"/>
      <line x1="150" y1="294" x2="380" y2="294"/>
      <line x1="150" y1="330" x2="380" y2="330"/>
    </g>
  </g>

  <!-- crisp outline over the mosaic to keep the play shape legible -->
  <path d="M188 148 L188 364 L356 256 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
