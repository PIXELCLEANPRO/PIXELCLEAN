<title>Panel de administrador | CLIPXEL Studio</title>
<meta name="description" content="Panel interno de estadísticas de uso de CLIPXEL." />
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://clipxel.github.io/admin.html" />
<link rel="icon" type="image/png" href="/assets/favicon-64.png" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  :root {
    --ink: #1d1d1f; --ink-soft: rgba(29,29,31,.64); --ink-faint: rgba(29,29,31,.4);
    --paper: #eef1f8; --panel: rgba(255,255,255,.5); --panel-2: rgba(255,255,255,.3); --line: rgba(20,20,40,.1);
    --signal: #0071e3; --signal-ink: #ffffff; --accent-2: #8b5cf6; --accent-3: #12b8ab; --stuck: #12a454;
    --danger: #d93025;
    --glass-border: rgba(255,255,255,.6);
    --shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(20,20,40,.05), 0 30px 60px -18px rgba(20,20,40,.22);
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f5f5f7; --ink-soft: rgba(245,245,247,.68); --ink-faint: rgba(245,245,247,.42);
      --paper: #0b0c10; --panel: rgba(32,33,40,.45); --panel-2: rgba(32,33,40,.3); --line: rgba(255,255,255,.12);
      --signal: #409cff; --signal-ink: #06070a; --accent-2: #a78bfa; --accent-3: #2fe0cf; --stuck: #4be890;
      --danger: #ff6b6b;
      --glass-border: rgba(255,255,255,.14);
      --shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.4), 0 30px 60px -18px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: var(--font-body); position: relative; isolation: isolate;
    padding: 40px 20px 60px;
  }
  body::before {
    content: ""; position: fixed; inset: -15%; z-index: -1;
    background:
      radial-gradient(32% 34% at 18% 22%, var(--signal) 0%, transparent 72%),
      radial-gradient(36% 38% at 88% 12%, var(--accent-2) 0%, transparent 72%),
      radial-gradient(40% 42% at 46% 92%, var(--accent-3) 0%, transparent 72%);
    filter: blur(90px) saturate(160%);
    opacity: .3;
  }
  a { color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 30px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 17px; }
  a.volver { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-faint); text-decoration: none; }
  a.volver:hover { color: var(--ink); }
  h1 { font-family: var(--font-display); font-size: 26px; margin: 0 0 6px; letter-spacing: -0.01em; }
  p.lede { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 28px; }
  .card {
    border-radius: 20px; padding: 24px; background: var(--panel); border: 1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
    box-shadow: var(--shadow);
  }
  .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .kpi { text-align: left; }
  .kpi .num { font-family: var(--font-display); font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .kpi .lbl { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; margin-top: 2px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
  h2 { font-family: var(--font-display); font-size: 15px; margin: 0 0 14px; }
  .bar-row { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-bottom: 10px; }
  .bar-row .bar-label { width: 96px; flex-shrink: 0; color: var(--ink-soft); text-transform: capitalize; }
  .bar-row .bar-track { flex: 1; height: 8px; border-radius: 6px; background: var(--panel-2); overflow: hidden; }
  .bar-row .bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--signal), var(--accent-2)); }
  .bar-row .bar-count { width: 30px; text-align: right; flex-shrink: 0; font-weight: 600; }
  .estado-msg { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .estado-msg.error { color: var(--danger); }
  .spinner { margin: 0 auto 14px; width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--glass-border); border-top-color: var(--signal); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .vacio { color: var(--ink-faint); font-size: 13px; }
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <img src="/assets/logo-icon.png" width="26" height="26" alt="" style="border-radius:22%;vertical-align:middle">
      <img src="/assets/logo-wordmark.png" height="16" alt="Clipxel" style="width:auto;vertical-align:middle">
    </div>
    <a class="volver" href="/">← Volver a clipxel.github.io</a>
  </div>

  <h1>Panel de administrador</h1>
  <p class="lede">Estadísticas de uso de CLIPXEL. Visible solo para cuentas admin.</p>

  <div id="contenido">
    <div class="estado-msg" id="estadoMsg">
      <div class="spinner"></div>
      Cargando...
    </div>
  </div>
</div>

<script>
  var SUPABASE_URL = "https://ujuibmpvicuibidkbdrq.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_x3mWkJJdqcimXIVkgbHEUA_-TWxzxtf";
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var contenido = document.getElementById("contenido");

  function mostrarMensaje(texto, esError) {
    contenido.innerHTML = '<div class="estado-msg' + (esError ? ' error' : '') + '">' + texto + '</div>';
  }

  function barrasDesdeObjeto(objeto) {
    var entradas = Object.keys(objeto || {}).map(function (k) { return [k, objeto[k]]; });
    if (!entradas.length) return '<p class="vacio">Sin datos todavía (últimos 30 días).</p>';
    entradas.sort(function (a, b) { return b[1] - a[1]; });
    var max = entradas[0][1];
    return entradas.map(function (e) {
      var pct = max ? Math.round((e[1] / max) * 100) : 0;
      return (
        '<div class="bar-row">' +
          '<div class="bar-label">' + e[0] + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="bar-count">' + e[1] + '</div>' +
        '</div>'
      );
    }).join("");
  }

  function pintarPanel(d) {
    contenido.innerHTML =
      '<div class="card">' +
        '<div class="grid-kpi">' +
          '<div class="kpi"><div class="num">' + d.usuarios_totales + '</div><div class="lbl">Usuarios totales</div></div>' +
          '<div class="kpi"><div class="num">' + d.usuarios_pro + '</div><div class="lbl">Usuarios Pro</div></div>' +
          '<div class="kpi"><div class="num">' + d.dau + '</div><div class="lbl">Activos hoy (DAU)</div></div>' +
          '<div class="kpi"><div class="num">' + d.mau + '</div><div class="lbl">Activos 30 días (MAU)</div></div>' +
          '<div class="kpi"><div class="num">' + d.nuevos_7d + '</div><div class="lbl">Nuevos (7 días)</div></div>' +
        '</div>' +
        '<div class="grid-2">' +
          '<div><h2>Sistemas operativos (30 días)</h2>' + barrasDesdeObjeto(d.sistemas_operativos) + '</div>' +
          '<div><h2>Motores usados (30 días)</h2>' + barrasDesdeObjeto(d.motores) + '</div>' +
          '<div><h2>Resoluciones (30 días)</h2>' + barrasDesdeObjeto(d.resoluciones) + '</div>' +
        '</div>' +
      '</div>';
  }

  async function cargar() {
    var { data: sesion } = await sb.auth.getSession();
    if (!sesion.session) {
      mostrarMensaje('No iniciaste sesión. <a href="cuenta.html">Iniciá sesión</a> con tu cuenta admin.', true);
      return;
    }

    var { data, error } = await sb.rpc("panel_estadisticas");
    if (error) {
      mostrarMensaje("No se pudieron cargar las estadísticas.", true);
      return;
    }
    if (!data || !data.ok) {
      mostrarMensaje((data && data.error) || "No autorizado.", true);
      return;
    }
    pintarPanel(data);
  }

  cargar();
</script>
